<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>食費のやりくり</title>
<meta name="description" content="月の予算から1日・今週に使える食費を計算するシンプルな家計アプリ">
<meta name="theme-color" content="#2f7d5b">
<style>
:root{
  --bg:#f3f5f2; --card:#ffffff; --text:#1f2a24; --muted:#6b776f; --line:#e2e7e3;
  --accent:#2f7d5b; --accent-soft:#e2f1e9; --on-accent:#ffffff;
  --food:#3b7fc4; --food-soft:#e4eef9; --eat:#d97f1e; --eat-soft:#fbeedd;
  --danger:#cf3434; --danger-soft:#fde7e7; --plus:#2f7d5b;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111513; --card:#1b211e; --text:#e7ece8; --muted:#97a39b; --line:#2b3330;
    --accent:#58c191; --accent-soft:#1d382c; --on-accent:#0d1a14;
    --food:#6ba9e6; --food-soft:#1b2c3d; --eat:#efa451; --eat-soft:#3a2a17;
    --danger:#ff6b6b; --danger-soft:#3b1d1d; --plus:#58c191;
    --shadow:none;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 12px}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px;cursor:pointer}
.monthnav .label{min-width:104px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 10px;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.remain-label{font-size:13px;color:var(--muted)}
.remain{font-size:40px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.remain.neg{color:var(--danger)}
.sub{font-size:13px;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 6px;display:flex}
.bar > span{display:block;height:100%}
.warn{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--danger-soft);color:var(--danger);font-weight:600;font-size:14px}
.warn.show{display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--accent-soft);border-radius:12px;padding:12px}
.tile .t{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-size:24px;font-weight:800;line-height:1.25}
.tile .s{font-size:12px;color:var(--muted)}
.tile.neg{background:var(--danger-soft)} .tile.neg .v{color:var(--danger)}
.result{margin-top:14px;padding:12px;border-radius:12px;background:var(--accent-soft);font-weight:700}
.result.neg{background:var(--danger-soft);color:var(--danger)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.seg button{padding:12px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--text);font-size:16px;font-weight:700;cursor:pointer}
.seg button[data-g=food].on{border-color:var(--food);background:var(--food-soft);color:var(--food)}
.seg button[data-g=eat].on{border-color:var(--eat);background:var(--eat-soft);color:var(--eat)}
.row{display:flex;gap:8px}
input[type=date],input.amount,input.budget{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;font-family:inherit;min-width:0}
.amountbox{position:relative;flex:1.4}
.amountbox::before{content:"¥";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.amountbox input{padding-left:28px;font-weight:700;font-variant-numeric:tabular-nums}
.datebox{flex:1}
.btn{display:block;width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);margin-top:8px;padding:10px;font-weight:600}
.btn.small{display:inline-block;width:auto;margin:0;padding:12px 16px}
.editing-note{display:none;font-size:13px;color:var(--eat);font-weight:600;margin-bottom:8px}
.editing .editing-note{display:block}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gbox{border-radius:12px;padding:12px}
.gbox.food{background:var(--food-soft)} .gbox.eat{background:var(--eat-soft)}
.gbox .t{font-size:13px;font-weight:700}
.gbox.food .t{color:var(--food)} .gbox.eat .t{color:var(--eat)}
.gbox .v{font-size:22px;font-weight:800}
.gbox .s{font-size:12px;color:var(--muted)}
.day{margin-top:12px}
.day:first-child{margin-top:0}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 2px 4px;border-bottom:1px solid var(--line)}
.entry{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip.food{background:var(--food-soft);color:var(--food)} .chip.eat{background:var(--eat-soft);color:var(--eat)}
.entry .amt{flex:1;font-weight:700;text-align:right}
.icon{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:15px;flex:none}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px 0}
.plusrow{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line)}
.plusrow .v{color:var(--plus);font-weight:700}
.plustotal{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-weight:700}
.plustotal .v{font-size:24px;color:var(--plus)}
.footer{display:flex;gap:8px;margin-top:4px}
.footer .btn{margin-top:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="dot"></span>食費のやりくり</div>
    <div class="monthnav">
      <button id="prev" aria-label="前の月">‹</button>
      <div class="label num" id="monthLabel"></div>
      <button id="next" aria-label="次の月">›</button>
    </div>
  </header>

  <!-- 残り金額 -->
  <section class="card" id="summary"></section>

  <!-- 入力 -->
  <section class="card" id="formCard">
    <h2>支払いを記録</h2>
    <div class="editing-note">✎ 記録を修正しています</div>
    <div class="seg">
      <button data-g="food" class="on">🥬 食材</button>
      <button data-g="eat">🍜 外食</button>
    </div>
    <div class="row">
      <div class="amountbox"><input class="amount" id="amount" inputmode="numeric" placeholder="支払った合計" autocomplete="off"></div>
      <div class="datebox"><input type="date" id="date"></div>
    </div>
    <button class="btn" id="submit">記録する</button>
    <button class="btn ghost" id="cancelEdit" hidden>修正をやめる</button>
  </section>

  <!-- ジャンル別 -->
  <section class="card">
    <h2>ジャンル別の支出</h2>
    <div id="genre"></div>
  </section>

  <!-- ログ -->
  <section class="card">
    <h2 id="logTitle">記録</h2>
    <div id="log"></div>
  </section>

  <!-- 黒字の月 -->
  <section class="card">
    <h2>予算が余った月</h2>
    <div id="plus"></div>
  </section>

  <!-- 予算設定 -->
  <section class="card">
    <h2 id="budgetTitle">今月の予算</h2>
    <div class="row">
      <div class="amountbox" style="flex:1"><input class="budget amount" id="budget" inputmode="numeric" placeholder="例: 40000" autocomplete="off"></div>
      <button class="btn small" id="saveBudget">保存</button>
    </div>
    <div class="sub" style="margin-top:6px">設定した予算は翌月以降にも引き継がれます。</div>
  </section>

  <div class="footer">
    <button class="btn ghost" id="demo">デモデータを入れる</button>
    <button class="btn ghost" id="clear">すべて消去</button>
  </div>
  <p class="note">データはこのブラウザの中にだけ保存されます。</p>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const KEY = 'shokuhi-yarikuri-v1';
  const G = { food:{label:'食材'}, eat:{label:'外食'} };
  const WD = ['日','月','火','水','木','金','土'];
  const $ = id => document.getElementById(id);

  // ---------- 日付ユーティリティ（ローカル時刻で扱う） ----------
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const ymOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1);
  const parseYm = ym => { const [y,m] = ym.split('-').map(Number); return {y,m}; };
  const shiftYm = (ym,n) => { const {y,m} = parseYm(ym); return ymOf(new Date(y, m-1+n, 1)); };
  const daysIn = ym => { const {y,m} = parseYm(ym); return new Date(y, m, 0).getDate(); };
  const ymLabel = ym => { const {y,m} = parseYm(ym); return y+'年'+m+'月'; };
  const yen = n => (n < 0 ? '-' : '') + '¥' + Math.abs(Math.round(n)).toLocaleString('ja-JP');
  const today = () => new Date();

  // ---------- 保存 ----------
  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.entries) && s.budgets) return s;
    }catch(e){}
    return { budgets:{}, entries:[] };
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ toast('保存できませんでした'); }
  }

  let state = load();
  let viewYm = ymOf(today());
  let genre = 'food';
  let editingId = null;

  // その月の予算：その月に設定があればそれ、なければ直近の過去月の設定を引き継ぐ
  function budgetOf(ym){
    if (ym in state.budgets) return state.budgets[ym];
    const keys = Object.keys(state.budgets).filter(k => k < ym).sort();
    return keys.length ? state.budgets[keys[keys.length-1]] : null;
  }
  const entriesOf = ym => state.entries.filter(e => e.date.slice(0,7) === ym);
  const sum = arr => arr.reduce((a,e) => a + e.amount, 0);

  function toAmount(str){
    const s = String(str).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[^\d]/g,'');
    return s ? Math.min(parseInt(s,10), 99999999) : 0;
  }

  // ---------- 描画 ----------
  function render(){
    const curYm = ymOf(today());
    $('monthLabel').textContent = ymLabel(viewYm);
    const budget = budgetOf(viewYm);
    const list = entriesOf(viewYm);
    const spent = sum(list);
    const food = sum(list.filter(e => e.genre === 'food'));
    const eat = spent - food;

    // --- サマリー ---
    let h = '';
    if (budget === null){
      h += '<h2>'+ymLabel(viewYm)+'の残り</h2>';
      h += '<div class="remain num">—</div><div class="sub">まずは下の「予算」で、この月に使える金額を設定してください。</div>';
      h += '<div class="sub" style="margin-top:6px">使った合計：<b class="num">'+yen(spent)+'</b></div>';
    } else {
      const remain = budget - spent;
      const pct = budget > 0 ? Math.min(100, spent / budget * 100) : 100;
      const fp = spent ? pct * food / spent : 0;
      h += '<h2>'+ymLabel(viewYm)+'の残り</h2>';
      h += '<div class="remain num'+(remain<0?' neg':'')+'">'+yen(remain)+'</div>';
      h += '<div class="bar"><span style="width:'+fp+'%;background:var(--food)"></span><span style="width:'+(pct-fp)+'%;background:var(--eat)"></span></div>';
      h += '<div class="sub num">予算 '+yen(budget)+' のうち '+yen(spent)+' 使用（'+Math.round(budget>0?spent/budget*100:0)+'%）</div>';
      h += '<div class="warn'+(remain<0?' show':'')+'">⚠ 予算を '+yen(-remain)+' オーバーしています</div>';

      if (viewYm === curYm){
        const t = today();
        const d = t.getDate();
        const dim = daysIn(viewYm);
        const daysLeft = dim - d + 1;                          // 今日を含む
        const toSunday = (7 - t.getDay()) % 7;                 // 日曜なら0
        const weekDays = Math.min(toSunday + 1, daysLeft);     // 今日〜日曜（月末で打ち切り）
        const perDay = remain > 0 ? Math.floor(remain / daysLeft) : 0;
        const perWeek = remain > 0 ? Math.min(remain, perDay * weekDays) : 0;
        // 今週（月曜〜今日、ただし今月分のみ）の支出
        const mon = new Date(t.getFullYear(), t.getMonth(), d - ((t.getDay()+6)%7));
        const monStr = ymd(mon) < viewYm+'-01' ? viewYm+'-01' : ymd(mon);
        const weekSpent = sum(list.filter(e => e.date >= monStr && e.date <= ymd(t)));
        const neg = remain <= 0 ? ' neg' : '';
        h += '<div class="tiles">';
        h += '<div class="tile'+neg+'"><div class="t">1日に使える</div><div class="v num">'+yen(perDay)+'</div><div class="s">今日を含め残り'+daysLeft+'日</div></div>';
        h += '<div class="tile'+neg+'"><div class="t">今週あと使える</div><div class="v num">'+yen(perWeek)+'</div><div class="s">日曜まで'+weekDays+'日・今週の支出 '+yen(weekSpent)+'</div></div>';
        h += '</div>';
      } else if (viewYm < curYm){
        h += remain >= 0
          ? '<div class="result num">この月は '+yen(remain)+' 余りました 🎉</div>'
          : '<div class="result neg num">この月は '+yen(-remain)+' オーバーでした</div>';
      } else {
        h += '<div class="sub" style="margin-top:10px">まだ始まっていない月です。</div>';
      }
    }
    $('summary').innerHTML = h;

    // --- ジャンル別 ---
    const pf = spent ? Math.round(food/spent*100) : 0;
    const cf = list.filter(e => e.genre==='food').length;
    const ce = list.length - cf;
    $('genre').innerHTML =
      '<div class="split">'+
        '<div class="gbox food"><div class="t">🥬 食材</div><div class="v num">'+yen(food)+'</div><div class="s num">'+(spent?pf:0)+'%・'+cf+'件</div></div>'+
        '<div class="gbox eat"><div class="t">🍜 外食</div><div class="v num">'+yen(eat)+'</div><div class="s num">'+(spent?100-pf:0)+'%・'+ce+'件</div></div>'+
      '</div>'+
      '<div class="bar" style="margin-bottom:0"><span style="width:'+(spent?pf:0)+'%;background:var(--food)"></span><span style="width:'+(spent?100-pf:0)+'%;background:var(--eat)"></span></div>';

    // --- ログ ---
    $('logTitle').textContent = ymLabel(viewYm)+'の記録（'+list.length+'件）';
    if (!list.length){
      $('log').innerHTML = '<div class="empty">まだ記録がありません</div>';
    } else {
      const sorted = list.slice().sort((a,b) => b.date.localeCompare(a.date) || b.created - a.created);
      const byDay = {};
      sorted.forEach(e => (byDay[e.date] = byDay[e.date] || []).push(e));
      let lh = '';
      Object.keys(byDay).forEach(day => {
        const dt = new Date(day+'T00:00:00');
        lh += '<div class="day"><div class="dayhead"><span>'+(dt.getMonth()+1)+'/'+dt.getDate()+'（'+WD[dt.getDay()]+'）</span><span class="num">'+yen(sum(byDay[day]))+'</span></div>';
        byDay[day].forEach(e => {
          lh += '<div class="entry"><span class="chip '+e.genre+'">'+G[e.genre].label+'</span><span class="amt num">'+yen(e.amount)+'</span>'+
                '<button class="icon" data-edit="'+e.id+'" aria-label="修正">✎</button>'+
                '<button class="icon" data-del="'+e.id+'" aria-label="削除">✕</button></div>';
        });
        lh += '</div>';
      });
      $('log').innerHTML = lh;
    }

    // --- 予算が余った月（今月より前で、残りがプラスの月） ---
    const months = new Set(state.entries.map(e => e.date.slice(0,7)));
    Object.keys(state.budgets).forEach(k => months.add(k));
    const plus = [...months].filter(ym => ym < curYm && budgetOf(ym) !== null)
      .map(ym => ({ ym, v: budgetOf(ym) - sum(entriesOf(ym)) }))
      .filter(x => x.v > 0)
      .sort((a,b) => b.ym.localeCompare(a.ym));
    if (!plus.length){
      $('plus').innerHTML = '<div class="empty">月が終わって予算が余ると、ここに表示されます</div>';
    } else {
      $('plus').innerHTML = plus.map(x => '<div class="plusrow"><span>'+ymLabel(x.ym)+'</span><span class="v num">+'+yen(x.v)+'</span></div>').join('') +
        '<div class="plustotal"><span>余った金額の合計</span><span class="v num">+'+yen(sum(plus.map(x=>({amount:x.v}))))+'</span></div>';
    }

    // --- 予算入力 ---
    $('budgetTitle').textContent = ymLabel(viewYm)+'の予算';
    if (document.activeElement !== $('budget')) $('budget').value = budget === null ? '' : budget.toLocaleString('ja-JP');
  }

  function resetForm(){
    editingId = null;
    $('formCard').classList.remove('editing');
    $('cancelEdit').hidden = true;
    $('submit').textContent = '記録する';
    $('amount').value = '';
    const t = today();
    $('date').value = ymOf(t) === viewYm ? ymd(t) : viewYm + '-01';
  }
  function setGenre(g){
    genre = g;
    document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.g === g));
  }

  let toastTimer;
  function toast(msg){
    const el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }

  // ---------- 操作 ----------
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setGenre(b.dataset.g)));

  $('amount').addEventListener('input', e => {
    const v = toAmount(e.target.value);
    e.target.value = v ? v.toLocaleString('ja-JP') : '';
  });
  $('budget').addEventListener('input', e => {
    const v = toAmount(e.target.value);
    e.target.value = v ? v.toLocaleString('ja-JP') : '';
  });
  $('amount').addEventListener('keydown', e => { if (e.key === 'Enter') $('submit').click(); });

  $('submit').addEventListener('click', () => {
    const amount = toAmount($('amount').value);
    const date = $('date').value;
    if (!amount){ toast('金額を入力してください'); $('amount').focus(); return; }
    if (!date){ toast('日付を選んでください'); return; }
    if (editingId){
      const e = state.entries.find(x => x.id === editingId);
      if (e){ e.amount = amount; e.date = date; e.genre = genre; }
      toast('修正しました');
    } else {
      state.entries.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), date, genre, amount, created: Date.now() });
      toast(G[genre].label+' '+yen(amount)+' を記録しました');
    }
    save();
    if (date.slice(0,7) !== viewYm) viewYm = date.slice(0,7);
    resetForm(); render();
  });

  $('cancelEdit').addEventListener('click', () => { resetForm(); });

  $('log').addEventListener('click', ev => {
    const ed = ev.target.closest('[data-edit]'), dl = ev.target.closest('[data-del]');
    if (ed){
      const e = state.entries.find(x => x.id === ed.dataset.edit); if (!e) return;
      editingId = e.id; setGenre(e.genre);
      $('amount').value = e.amount.toLocaleString('ja-JP'); $('date').value = e.date;
      $('formCard').classList.add('editing'); $('cancelEdit').hidden = false; $('submit').textContent = '修正を保存';
      $('formCard').scrollIntoView({ behavior:'smooth', block:'start' });
    }
    if (dl){
      const e = state.entries.find(x => x.id === dl.dataset.del); if (!e) return;
      if (!confirm(e.date.replace(/-/g,'/')+' の '+G[e.genre].label+' '+yen(e.amount)+' を削除しますか？')) return;
      state.entries = state.entries.filter(x => x.id !== e.id);
      if (editingId === e.id) resetForm();
      save(); render(); toast('削除しました');
    }
  });

  $('saveBudget').addEventListener('click', () => {
    const v = toAmount($('budget').value);
    if (!v){ toast('予算を入力してください'); return; }
    state.budgets[viewYm] = v; save(); $('budget').blur(); render(); toast(ymLabel(viewYm)+'の予算を '+yen(v)+' にしました');
  });

  $('prev').addEventListener('click', () => { viewYm = shiftYm(viewYm,-1); resetForm(); render(); });
  $('next').addEventListener('click', () => { viewYm = shiftYm(viewYm, 1); resetForm(); render(); });

  $('clear').addEventListener('click', () => {
    if (!confirm('予算とすべての記録を消去します。元に戻せません。よろしいですか？')) return;
    state = { budgets:{}, entries:[] }; save(); viewYm = ymOf(today()); resetForm(); render(); toast('消去しました');
  });

  // デモ用：過去3か月＋今月のサンプルデータ
  $('demo').addEventListener('click', () => {
    if (state.entries.length && !confirm('今のデータをデモデータで置き換えます。よろしいですか？')) return;
    const t = today(), cur = ymOf(t);
    const rnd = (a,b) => Math.round((a + Math.random()*(b-a))/10)*10;
    const entries = [];
    const startYm = shiftYm(cur,-3);
    for (let i = 0; i < 4; i++){
      const ym = shiftYm(startYm, i), {y,m} = parseYm(ym);
      const last = ym === cur ? t.getDate() : daysIn(ym);
      for (let d = 1; d <= last; d++){
        const ds = y+'-'+pad(m)+'-'+pad(d), dow = new Date(y,m-1,d).getDay();
        if (Math.random() < 0.36) entries.push({ genre:'food', amount:rnd(900,4800), date:ds });
        if ((dow === 5 || dow === 6) && Math.random() < 0.5) entries.push({ genre:'eat', amount:rnd(1200,4500), date:ds });
      }
    }
    state = {
      budgets: { [startYm]: 40000 },
      entries: entries.map((e,i) => Object.assign(e, { id:'demo'+i, created: i }))
    };
    save(); viewYm = cur; resetForm(); render(); toast('デモデータを入れました');
  });

  resetForm(); render();
})();
</script>
</body>
</html>
